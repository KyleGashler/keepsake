# Pick an unguessable app name — until a real token verifier lands (B1) this
# deployment still runs dev auth, so the URL is most of what stands between
# the archive and the world.
app = "keepsake-demo-h4t9wq"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "4000"
  WEB_DIR = "/app/web"
  MEDIA_DIR = "/data/media"
  SEED_DEMO = "1"
  # One machine: the job worker (transcription) runs inside the API process.
  # DEEPGRAM_API_KEY is a secret (`fly secrets set`); without it clips are
  # marked FAILED and can be retried from the memory page once it's set.
  WORKER_INLINE = "1"
  # Originals live in S3; MEDIA_DIR still serves pre-A5 /media/uploads files.
  STORAGE_PROVIDER = "s3"
  S3_BUCKET = "memories-and-more-memories"
  S3_REGION = "us-east-2"
  # Dev auth: a bearer token of `dev:<email>` is taken at face value, and a
  # request with no token at all is treated as DEV_DEFAULT_USER. That is not
  # authentication — ALLOW_DEV_AUTH_IN_PROD is the explicit opt-in the server
  # demands before it will boot this way, and it exists only so the demo keeps
  # working until the Firebase verifier lands (B1). Delete all three then.
  AUTH_MODE = "dev"
  ALLOW_DEV_AUTH_IN_PROD = "1"
  DEV_DEFAULT_USER = "demo@keepsake.local"

[http_service]
  internal_port = 4000
  force_https = true
  # Scales to zero between viewings; first request after idle takes a few
  # seconds to wake.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    path = "/api/health"
    method = "GET"
    interval = "15s"
    timeout = "5s"
    grace_period = "40s"

# Uploaded media lives here so redeploys don't erase it.
[[mounts]]
  source = "keepsake_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
