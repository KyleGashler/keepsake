# The name predates real sign-in (B1), when the URL was the only lock on the
# demo. Every API call now needs a Firebase ID token.
app = "keepsake-demo-h4t9wq"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "4000"
  WEB_DIR = "/app/web"
  # No volume: every original lives in S3, so the machine's disk is scratch
  # space only. (A volume pins the machine to one physical host, which is what
  # failed the 2026-10-17 deploy with "insufficient CPUs".)
  MEDIA_DIR = "/tmp/media"
  SEED_DEMO = "1"
  # One machine: the job worker (mux.sync) runs inside the API process.
  WORKER_INLINE = "1"
  # Video and audio live on Mux (Production environment). Its credentials are
  # secrets, not [env]: `fly secrets set MUX_TOKEN_ID=… MUX_TOKEN_SECRET=…
  # MUX_SIGNING_KEY_ID=… MUX_SIGNING_KEY_PRIVATE=… MUX_WEBHOOK_SECRET=…`, with
  # the webhook pointed at https://<app>.fly.dev/api/webhooks/mux. Without
  # them the app runs and video/audio uploads answer 503.
  # Photos, covers and avatars live in S3.
  STORAGE_PROVIDER = "s3"
  S3_BUCKET = "memories-and-more-memories"
  S3_REGION = "us-east-2"
  # Sign-in is Firebase Auth (email + password). The API verifies each
  # request's ID token against this project with no credentials beyond its id;
  # the server refuses to boot in firebase mode without it. It must be the same
  # project the web bundle was built for (EXPO_PUBLIC_FIREBASE_PROJECT_ID in
  # the Dockerfile). Dev tokens (`dev:<email>`) are rejected here.
  AUTH_MODE = "firebase"
  FIREBASE_PROJECT_ID = "REPLACE_ME_PROD_PROJECT_ID"

[http_service]
  internal_port = 4000
  force_https = true
  # Scales to zero between viewings; first request after idle takes a few
  # seconds to wake.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    path = "/api/health"
    method = "GET"
    interval = "15s"
    timeout = "5s"
    grace_period = "40s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
