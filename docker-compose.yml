# Named rather than taken from the checkout's folder, so containers and
# volumes are called little-by-little-* wherever the repo is cloned.
name: little-by-little

# Where the API reaches the S3 emulator, and as whom. Inert unless
# STORAGE_PROVIDER=s3 — see the Storage section of the README.
x-s3-env: &s3-env
  S3_BUCKET: littlebylittle-dev
  S3_REGION: us-east-1
  S3_ENDPOINT: http://s3:9000
  S3_FORCE_PATH_STYLE: "1"
  AWS_ACCESS_KEY_ID: littlebylittle
  AWS_SECRET_ACCESS_KEY: littlebylittle-dev-secret

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: littlebylittle
      POSTGRES_PASSWORD: littlebylittle
      POSTGRES_DB: littlebylittle
    ports:
      # Host port is 55432 to stay out of the way of any local Postgres.
      - "55432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U littlebylittle -d littlebylittle"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./server
    environment:
      DATABASE_URL: postgresql://littlebylittle:littlebylittle@db:5432/littlebylittle
      PORT: "4000"
      MEDIA_DIR: /app/media
      SEED_DEMO: "1"
      # Run the job worker (mux.sync polling) inside the API process.
      WORKER_INLINE: "1"
      # Video and audio go to Mux (README, "Video and audio (Mux)"). Put the
      # Development environment's credentials in a root .env; unset, the API
      # still runs and AV uploads answer 503. No webhook secret locally: Mux
      # can't reach this machine, so the mux.sync job polls instead.
      MUX_TOKEN_ID: ${MUX_TOKEN_ID:-}
      MUX_TOKEN_SECRET: ${MUX_TOKEN_SECRET:-}
      MUX_SIGNING_KEY_ID: ${MUX_SIGNING_KEY_ID:-}
      MUX_SIGNING_KEY_PRIVATE: ${MUX_SIGNING_KEY_PRIVATE:-}
      MUX_WEBHOOK_SECRET: ${MUX_WEBHOOK_SECRET:-}
      # `Bearer dev:<email>` is the whole credential in dev mode — see the Auth
      # section of the README. DEV_DEFAULT_USER is who an unauthenticated
      # request is treated as, which keeps the app working until it learns to
      # send a token (A8).
      AUTH_MODE: dev
      DEV_DEFAULT_USER: demo@littlebylittle.local
      # `local` keeps originals on the `media` volume. To run against the S3
      # emulator instead: STORAGE_PROVIDER=s3 docker compose --profile s3 up
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      <<: *s3-env
      # Presigned URLs are signed for the host the browser uses, not `s3:9000`.
      S3_PUBLIC_ENDPOINT: http://localhost:9300
    ports:
      - "4000:4000"
    volumes:
      - ./server:/app
      - /app/node_modules
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./app
    environment:
      # Baked into the web bundle — the browser talks to the API on the host.
      EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://localhost:4000}
      EXPO_NO_TELEMETRY: "1"
    ports:
      - "8081:8081"
    volumes:
      - ./app:/app
      - /app/node_modules
    depends_on:
      - api

  # S3-compatible emulator (RustFS) for STORAGE_PROVIDER=s3. It validates
  # SigV4 presigned URLs, conditional writes, versioning and bucket CORS, so
  # the upload path behaves as it will against AWS. Only starts with
  # `--profile s3`. Host port 9300 (9090/9191 are commonly taken by s3mock).
  s3:
    image: rustfs/rustfs:1.0.1
    profiles: ["s3"]
    environment:
      RUSTFS_ACCESS_KEY: littlebylittle
      RUSTFS_SECRET_KEY: littlebylittle-dev-secret
    ports:
      - "9300:9000"
    volumes:
      - s3-data:/data

  # One-shot: creates the bucket, enables versioning, sets CORS for the app.
  s3-init:
    build: ./server
    profiles: ["s3"]
    command: npm run --silent storage:s3-setup
    environment:
      <<: *s3-env
      S3_CORS_ORIGINS: http://localhost:8081
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      - s3
    restart: on-failure

volumes:
  db-data:
  media:
  s3-data:
