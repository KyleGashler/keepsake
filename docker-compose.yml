services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: keepsake
      POSTGRES_PASSWORD: keepsake
      POSTGRES_DB: keepsake
    ports:
      # Host port is 55432 to stay out of the way of any local Postgres.
      - "55432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keepsake -d keepsake"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./server
    environment:
      DATABASE_URL: postgresql://keepsake:keepsake@db:5432/keepsake
      PORT: "4000"
      MEDIA_DIR: /app/media
    ports:
      - "4000:4000"
    volumes:
      - ./server:/app
      - /app/node_modules
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./app
    environment:
      # Baked into the web bundle — the browser talks to the API on the host.
      EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://localhost:4000}
      EXPO_NO_TELEMETRY: "1"
    ports:
      - "8081:8081"
    volumes:
      - ./app:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  db-data:
  media:
